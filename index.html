<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla Exterior - Mundial 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos de fuente de alto impacto para visibilidad a larga distancia */
        .font-huge {
            font-size: 8rem;
            line-height: 1;
        }
        @media (min-width: 768px) {
            .font-huge {
                font-size: 13rem;
            }
        }
    </style>
</head>
<body class="bg-black min-h-screen flex items-center justify-center p-6 font-sans text-white select-none">

    <!-- Contenedor Principal Optimizado para Pantalla Gigante (Máxima visibilidad, colores sólidos) -->
    <div class="bg-slate-900 w-full max-w-5xl rounded-3xl shadow-2xl overflow-hidden border-4 border-green-600" id="match-card">
        
        <!-- Encabezado Único del Torneo (Letra masiva, sin distracciones) -->
        <div class="bg-green-600 text-center py-6">
            <h1 id="tournament-name" class="text-3xl md:text-5xl font-black tracking-wider uppercase text-white">
                Copa Mundial de Fútbol de 2026
            </h1>
        </div>

        <!-- Área Principal del Marcador (Elementos gigantes y simétricos) -->
        <div class="flex flex-col md:flex-row items-center justify-around p-8 md:p-12 space-y-8 md:space-y-0">
            
            <!-- Equipo Local -->
            <div class="flex flex-col items-center w-full md:w-2/5 text-center">
                <!-- Contenedor de bandera con marcador de posición CSS incorporado -->
                <div class="relative w-44 h-28 md:w-60 md:h-40 bg-slate-800 rounded-2xl shadow-2xl border-4 border-slate-700 overflow-hidden mb-4">
                    <!-- Iniciales de respaldo en caso de desconexión o carga lenta -->
                    <div id="home-flag-fallback" class="absolute inset-0 flex items-center justify-center font-black text-3xl md:text-5xl text-slate-500 bg-slate-800 uppercase tracking-widest">
                        MX
                    </div>
                    <!-- Imagen de la bandera que se muestra suavemente al cargar -->
                    <img id="home-flag" 
                         src="https://flagcdn.com/w320/mx.png" 
                         alt="Bandera Local" 
                         class="absolute inset-0 w-full h-full object-cover transition-opacity duration-300 opacity-0"
                         onload="this.classList.remove('opacity-0')">
                </div>
                <h2 id="home-name" class="text-3xl md:text-5xl font-black uppercase tracking-widest text-green-400">MÉXICO</h2>
            </div>

            <!-- Marcador Gigante Central -->
            <div class="flex flex-col items-center justify-center w-full md:w-1/5">
                <div class="flex items-center justify-center space-x-6 md:space-x-10">
                    <span id="home-score" class="font-huge font-black text-white tracking-tighter">1</span>
                    <span class="text-4xl md:text-6xl font-bold text-slate-500">-</span>
                    <span id="away-score" class="font-huge font-black text-white tracking-tighter">1</span>
                </div>
                
                <!-- Estado del partido -->
                <div class="mt-4">
                    <span id="match-status" class="text-lg md:text-2xl px-6 py-2 rounded-full font-black uppercase tracking-widest bg-slate-700 text-slate-300">
                        Finalizado
                    </span>
                </div>
            </div>

            <!-- Equipo Visitante -->
            <div class="flex flex-col items-center w-full md:w-2/5 text-center">
                <!-- Contenedor de bandera con marcador de posición CSS incorporado -->
                <div class="relative w-44 h-28 md:w-60 md:h-40 bg-slate-800 rounded-2xl shadow-2xl border-4 border-slate-700 overflow-hidden mb-4">
                    <!-- Iniciales de respaldo en caso de desconexión o carga lenta -->
                    <div id="away-flag-fallback" class="absolute inset-0 flex items-center justify-center font-black text-3xl md:text-5xl text-slate-500 bg-slate-800 uppercase tracking-widest">
                        ZA
                    </div>
                    <!-- Imagen de la bandera que se muestra suavemente al cargar -->
                    <img id="away-flag" 
                         src="https://flagcdn.com/w320/za.png" 
                         alt="Bandera Visitante" 
                         class="absolute inset-0 w-full h-full object-cover transition-opacity duration-300 opacity-0"
                         onload="this.classList.remove('opacity-0')">
                </div>
                <h2 id="away-name" class="text-3xl md:text-5xl font-black uppercase tracking-widest text-green-400">SUDAFRICA</h2>
            </div>
            
        </div>
    </div>

    <script>
        // =========================================================================
        // DATOS DEL PARTIDO (Modifica este objeto para actualizar la pantalla exterior)
        // =========================================================================
        const partidoData = {
            torneo: "Copa Mundial de Fútbol de 2026",
            estado: "FINALIZADO", // Opciones para la pantalla: "EN VIVO", "FINALIZADO", "PROGRAMADO"
            minutoEnVivo: "75'",    // Se mostrará al lado de "En Vivo" (ej: "75'")
            local: {
                nombre: "México",
                siglas: "MX",
                banderaUrl: "https://flagcdn.com/w320/mx.png", // Resolución óptima certificada
                goles: 1
            },
            visitante: {
                nombre: "Sudáfrica",
                siglas: "ZA",
                banderaUrl: "https://flagcdn.com/w320/za.png", // Resolución óptima certificada
                goles: 1
            }
        };

        // =========================================================================
        // FUNCIÓN DE RENDERIZADO (No necesitas tocar esto)
        // =========================================================================
        function renderizarPartido(data) {
            // Título principal
            document.getElementById('tournament-name').textContent = data.torneo;

            // Datos Local
            document.getElementById('home-name').textContent = data.local.nombre.toUpperCase();
            document.getElementById('home-flag-fallback').textContent = data.local.siglas.toUpperCase();
            
            const homeImg = document.getElementById('home-flag');
            homeImg.classList.add('opacity-0'); // Ocultar mientras cambia
            homeImg.src = data.local.banderaUrl;
            homeImg.alt = `Bandera de ${data.local.nombre}`;
            document.getElementById('home-score').textContent = data.local.goles;

            // Datos Visitante
            document.getElementById('away-name').textContent = data.visitante.nombre.toUpperCase();
            document.getElementById('away-flag-fallback').textContent = data.visitante.siglas.toUpperCase();
            
            const awayImg = document.getElementById('away-flag');
            awayImg.classList.add('opacity-0'); // Ocultar mientras cambia
            awayImg.src = data.visitante.banderaUrl;
            awayImg.alt = `Bandera de ${data.visitante.nombre}`;
            document.getElementById('away-score').textContent = data.visitante.goles;

            // Estado visual del partido
            const statusBadge = document.getElementById('match-status');
            if (data.estado === "EN VIVO") {
                statusBadge.innerHTML = `En Vivo <span class="ml-2 text-white animate-pulse font-black">${data.minutoEnVivo}</span>`;
                statusBadge.className = "bg-red-600 text-white text-lg md:text-2xl px-6 py-2 rounded-full font-black uppercase tracking-widest animate-pulse shadow-[0_0_20px_rgba(220,38,38,0.8)]";
            } else if (data.estado === "FINALIZADO") {
                statusBadge.textContent = "Finalizado";
                statusBadge.className = "bg-slate-700 text-slate-300 text-lg md:text-2xl px-6 py-2 rounded-full font-black uppercase tracking-widest";
            } else {
                statusBadge.textContent = "Programado";
                statusBadge.className = "bg-blue-600 text-white text-lg md:text-2xl px-6 py-2 rounded-full font-black uppercase tracking-widest";
            }
        }

        // Carga inmediata de la configuración manual
        document.addEventListener('DOMContentLoaded', () => {
            renderizarPartido(partidoData);
        });
    </script>
</body>
</html>
