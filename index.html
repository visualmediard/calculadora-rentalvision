<!DOCTYPE html>
<html lang="es" class="m-0 p-0 h-full w-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla Exterior - Mundial 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos de fuente ultra-legibles para distancias extremas */
        .font-huge {
            font-size: 10rem;
            line-height: 1;
        }
        @media (min-width: 768px) {
            .font-huge {
                font-size: 15rem;
            }
        }
        @media (min-width: 1280px) {
            .font-huge {
                font-size: 18rem;
            }
        }
    </style>
</head>
<body class="bg-black m-0 p-0 h-screen w-screen overflow-hidden font-sans text-white select-none flex flex-col justify-between">

    <!-- Contenedor Principal (100% del ancho y alto de la pantalla, sin bordes redondos para encaje perfecto de hardware) -->
    <div class="bg-slate-900 w-full h-full flex flex-col justify-between" id="match-card">
        
        <!-- Encabezado Único del Torneo (Ajustado para ocupar el tope exacto 0px) -->
        <div class="bg-green-600 text-center py-6 md:py-8 flex-none w-full">
            <h1 id="tournament-name" class="text-3xl md:text-5xl lg:text-6xl font-black tracking-wider uppercase text-white">
                Copa Mundial de Fútbol de 2026
            </h1>
        </div>

        <!-- Área Principal del Marcador (Distribución simétrica a lo ancho de la pantalla) -->
        <div class="flex-grow flex flex-col md:flex-row items-center justify-around px-8 py-4 md:py-0 space-y-4 md:space-y-0">
            
            <!-- Equipo Local -->
            <div class="flex flex-col items-center w-full md:w-2/5 text-center justify-center">
                <!-- Contenedor de bandera con marcador de posición CSS de seguridad -->
                <div class="relative w-48 h-32 md:w-64 md:h-44 lg:w-80 lg:h-56 bg-slate-800 rounded-2xl shadow-2xl border-4 border-slate-700 overflow-hidden mb-4">
                    <!-- Iniciales de respaldo -->
                    <div id="home-flag-fallback" class="absolute inset-0 flex items-center justify-center font-black text-4xl md:text-6xl text-slate-500 bg-slate-800 uppercase tracking-widest">
                        MX
                    </div>
                    <!-- Imagen de la bandera que se muestra suavemente al cargar -->
                    <img id="home-flag" 
                         src="https://flagcdn.com/w320/mx.png" 
                         alt="Bandera Local" 
                         class="absolute inset-0 w-full h-full object-cover transition-opacity duration-300 opacity-0"
                         onload="this.classList.remove('opacity-0')">
                </div>
                <h2 id="home-name" class="text-3xl md:text-5xl lg:text-6xl font-black uppercase tracking-widest text-green-400">MÉXICO</h2>
            </div>

            <!-- Marcador Gigante Central (Desplazado ligeramente hacia arriba para pantallas grandes con transform) -->
            <div class="flex flex-col items-center justify-center w-full md:w-1/5 my-4 md:my-0 transform md:-translate-y-8 lg:-translate-y-12 transition-transform duration-300">
                <div class="flex items-center justify-center space-x-6 md:space-x-10">
                    <span id="home-score" class="font-huge font-black text-white tracking-tighter">1</span>
                    <span class="text-5xl md:text-7xl font-bold text-slate-500">-</span>
                    <span id="away-score" class="font-huge font-black text-white tracking-tighter">1</span>
                </div>
            </div>

            <!-- Equipo Visitante -->
            <div class="flex flex-col items-center w-full md:w-2/5 text-center justify-center">
                <!-- Contenedor de bandera con marcador de posición CSS de seguridad -->
                <div class="relative w-48 h-32 md:w-64 md:h-44 lg:w-80 lg:h-56 bg-slate-800 rounded-2xl shadow-2xl border-4 border-slate-700 overflow-hidden mb-4">
                    <!-- Iniciales de respaldo -->
                    <div id="away-flag-fallback" class="absolute inset-0 flex items-center justify-center font-black text-4xl md:text-6xl text-slate-500 bg-slate-800 uppercase tracking-widest">
                        ZA
                    </div>
                    <!-- Imagen de la bandera -->
                    <img id="away-flag" 
                         src="https://flagcdn.com/w320/za.png" 
                         alt="Bandera Visitante" 
                         class="absolute inset-0 w-full h-full object-cover transition-opacity duration-300 opacity-0"
                         onload="this.classList.remove('opacity-0')">
                </div>
                <h2 id="away-name" class="text-3xl md:text-5xl lg:text-6xl font-black uppercase tracking-widest text-green-400">SUDAFRICA</h2>
            </div>
            
        </div>
    </div>

    <script>
        // =========================================================================
        // DATOS DEL PARTIDO (Modifica este objeto para actualizar la pantalla exterior)
        // =========================================================================
        const partidoData = {
            torneo: "Copa Mundial de Fútbol de 2026",
            local: {
                nombre: "México",
                siglas: "MX",
                banderaUrl: "https://flagcdn.com/w320/mx.png",
                goles: 1
            },
            visitante: {
                nombre: "Sudáfrica",
                siglas: "ZA",
                banderaUrl: "https://flagcdn.com/w320/za.png",
                goles: 1
            }
        };

        // =========================================================================
        // FUNCIÓN DE RENDERIZADO (No necesitas tocar esto)
        // =========================================================================
        function renderizarPartido(data) {
            // Título principal
            document.getElementById('tournament-name').textContent = data.torneo;

            // Datos Local
            document.getElementById('home-name').textContent = data.local.nombre.toUpperCase();
            document.getElementById('home-flag-fallback').textContent = data.local.siglas.toUpperCase();
            
            const homeImg = document.getElementById('home-flag');
            homeImg.classList.add('opacity-0'); 
            homeImg.src = data.local.banderaUrl;
            homeImg.alt = `Bandera de ${data.local.nombre}`;
            document.getElementById('home-score').textContent = data.local.goles;

            // Datos Visitante
            document.getElementById('away-name').textContent = data.visitante.nombre.toUpperCase();
            document.getElementById('away-flag-fallback').textContent = data.visitante.siglas.toUpperCase();
            
            const awayImg = document.getElementById('away-flag');
            awayImg.classList.add('opacity-0'); 
            awayImg.src = data.visitante.banderaUrl;
            awayImg.alt = `Bandera de ${data.visitante.nombre}`;
            document.getElementById('away-score').textContent = data.visitante.goles;
        }

        // Carga inmediata de la configuración manual
        document.addEventListener('DOMContentLoaded', () => {
            renderizarPartido(partidoData);
        });
    </script>
</body>
</html>
